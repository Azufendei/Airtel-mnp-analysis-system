name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mnp-ai-bot

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: mnp_bot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mnp-ai-bot/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap Database
        env:
          DATABASE_URL: postgresql://postgres:ci_password_123@localhost:5432/mnp_bot_db
          SECRET_KEY: ci-test-secret-key-32-characters-long
          ALGORITHM: HS256
          ENVIRONMENT: test
        run: |
          python setup_db.py

      - name: Run PyTest Suite (10 Automated Tests)
        env:
          DATABASE_URL: postgresql://postgres:ci_password_123@localhost:5432/mnp_bot_db
          SECRET_KEY: ci-test-secret-key-32-characters-long
          ALGORITHM: HS256
          ENVIRONMENT: test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: qwen/qwen3.8-27b
        run: |
          pytest -v

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mnp-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mnp-frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck and Build Bundle
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
